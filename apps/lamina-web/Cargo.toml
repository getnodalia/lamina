[package]
name = "lamina-web"
description = "Lámina in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "lamina-web"
path = "src/main.rs"

[dependencies]
lamina-engine = { workspace = true }
lamina-ui-egui = { workspace = true }
# The page command API (#413): window.lamina over the control channel.
nodalia-web-api = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
# The host messages (getnodalia/foundation (vendor/nodalia-libs)): one contract and one bridge for the web builds.
nodalia-web-host = { git = "https://github.com/getnodalia/foundation", rev = "a5ba368c1313d208fe927b5bbdf06bddf38b1b2f", version = "0.1.0" }
egui = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
rfd = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "CssStyleDeclaration", "MessageEvent", "Event", "EventTarget", "UrlSearchParams"] }
